<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignSpeak · Quick survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A38;--muted:#4C6277;--line:#CFE0EA;--brand:#0B7F96;--brand-d:#08687B;--sky:#46B1E8;--mint:#35C590;--sun:#F5B800;--coral:#FF7A6B;--bg:#E4F2FA;--acc:var(--sky)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Nunito,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;line-height:1.45;min-height:100vh;
  background:radial-gradient(900px 500px at 8% -5%,rgba(70,177,232,.45),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(53,197,144,.35),transparent 60%),radial-gradient(700px 500px at 50% 105%,rgba(245,184,0,.28),transparent 60%),var(--bg)}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(11,127,150,.14) 1.3px,transparent 1.4px);background-size:26px 26px;pointer-events:none}
.wrap{position:relative;max-width:820px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:-.02em}.logo span{color:var(--brand)}
.count{font-weight:900;color:var(--brand);background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.95rem}
.bar{height:16px;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--mint),var(--sun));transition:width .45s cubic-bezier(.3,1.2,.5,1)}
.cheer{min-height:1.6em;text-align:center;font-weight:800;color:var(--muted);margin:2px 0 12px}
.card{background:#fff;border-radius:30px;padding:30px 28px 26px;box-shadow:0 14px 38px rgba(27,42,56,.13);position:relative;overflow:hidden;animation:in .38s cubic-bezier(.2,1,.4,1)}
.card.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;color:#0e3f4a;background:color-mix(in srgb,var(--acc) 28%,#fff);border-radius:999px;padding:6px 14px}
h1{font-size:clamp(1.5rem,4.2vw,2.1rem);line-height:1.2;margin:.8rem 0 1.4rem;letter-spacing:-.02em;font-weight:900;outline:none}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:inherit;font-weight:800;font-size:1.15rem;color:var(--ink);cursor:pointer;
  background:#F4FAFD;border:2.5px solid var(--line);border-radius:20px;padding:15px 18px;transition:transform .12s,border-color .12s,background .12s,box-shadow .12s}
.opt .e{font-size:1.9rem;line-height:1;width:2.2rem;text-align:center}
.opt:hover{transform:translateY(-2px);border-color:var(--acc);background:#fff;box-shadow:0 8px 18px rgba(27,42,56,.10)}
.opt:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.opt[aria-checked=true]{border-color:var(--brand);background:color-mix(in srgb,var(--mint) 22%,#fff);box-shadow:0 0 0 4px rgba(53,197,144,.30);transform:scale(1.015)}
.opt .k{margin-left:auto;font-size:.85rem;font-weight:900;color:var(--muted);background:#fff;border:2px solid var(--line);border-radius:8px;padding:0 8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.face{display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;cursor:pointer;color:var(--ink);padding:16px 4px 12px;border-radius:22px;border:2.5px solid var(--line);background:#F4FAFD;transition:transform .14s,border-color .14s,background .14s,box-shadow .14s}
.face .e{font-size:clamp(2rem,7vw,2.9rem);line-height:1;transition:transform .2s}
.face .n{font-weight:900;font-size:1.05rem;color:var(--muted)}
.face:hover{transform:translateY(-4px);border-color:var(--c);background:#fff;box-shadow:0 10px 20px rgba(27,42,56,.12)}
.face:hover .e{transform:scale(1.18) rotate(-4deg)}
.face:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.face[aria-checked=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,#fff);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 38%,transparent)}
.face[aria-checked=true] .e{transform:scale(1.22)}
.face[aria-checked=true] .n{color:var(--ink)}
.ends{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-weight:800;color:var(--muted);font-size:.95rem}
.ends span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer;border:2.5px solid var(--line);background:#F4FAFD;color:var(--ink);border-radius:999px;padding:10px 16px;transition:transform .12s,background .12s,border-color .12s}
.chip:hover{transform:translateY(-2px);border-color:var(--acc);background:#fff}
.chip:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.more{margin-top:20px}.more label{display:block;font-weight:900;margin-bottom:8px}
textarea{width:100%;min-height:90px;resize:vertical;font:inherit;font-weight:700;color:var(--ink);border:2.5px solid var(--line);border-radius:18px;padding:12px 14px;background:#F4FAFD}
textarea:focus{outline:4px solid rgba(70,177,232,.45);border-color:var(--sky);background:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.ghost{font:inherit;font-weight:900;cursor:pointer;background:transparent;border:0;color:var(--brand);padding:10px 6px;border-radius:12px}
.ghost:hover{text-decoration:underline}.ghost[disabled]{visibility:hidden}
.ghost:focus-visible,.go:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.hint{color:var(--muted);font-weight:700;font-size:.92rem}
.go{font:inherit;font-weight:900;font-size:1.2rem;cursor:pointer;border:0;color:#fff;border-radius:999px;padding:15px 30px;background:linear-gradient(135deg,var(--mint),var(--brand));box-shadow:0 10px 24px rgba(11,127,150,.35);transition:transform .14s}
.go:hover{transform:translateY(-2px)}.go[disabled]{opacity:.6;cursor:wait}
.thanks{text-align:center;padding:14px 4px 4px}
.thanks .big{font-size:5rem;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.thanks h1{margin:.4rem 0 .6rem}.thanks p{color:var(--muted);font-weight:700;font-size:1.1rem;margin:.3rem auto 1.2rem;max-width:520px}
.demo,.err{margin:14px auto;max-width:560px;border-radius:16px;padding:12px 16px;font-weight:800;text-align:left}
.demo{background:#FFF1C2;border:2px solid #F0D568}.err{background:#FDE3DE;border:2px solid #F3A89B;color:#8F2A1B}
.btn2{display:inline-block;text-decoration:none;font:inherit;font-weight:900;color:var(--brand);background:#fff;border:2.5px solid var(--brand);border-radius:999px;padding:12px 24px;margin:4px}
.btn2:hover{background:var(--brand);color:#fff}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
@media (max-width:560px){.card{padding:24px 16px 20px;border-radius:24px}.scale{gap:6px}.opt{font-size:1.05rem;padding:13px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap">
  <header><div class="logo">Sign<span>Speak</span> <span style="color:var(--muted);font-weight:800;font-size:1rem">survey</span></div><div class="count" id="count">1 / 15</div></header>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="15" id="pb"><i id="fill"></i></div>
  <div class="cheer" id="cheer" aria-live="polite"></div>
  <section id="stage"></section>
</main>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var CFG = window.SIGNSPEAK || {};
  var Q = [
    {k:"role", tag:"About you", c:"var(--sky)", t:"Which side of SignSpeak did you try?", o:[
      ["🤟","Signer"],["💬","Speaker"],["🔄","Both"]]},
    {k:"device", tag:"About you", c:"var(--sky)", t:"What device are you using?", o:[
      ["💻","Laptop or desktop"],["📱","Phone"],["📟","Tablet"]]},
    {k:"familiarity", tag:"About you", c:"var(--sky)", t:"How familiar are you with sign language?", o:[
      ["🙅","Not at all"],["🌱","I know a few signs"],["🙂","Quite comfortable"],["🤟","Fluent"]]},
    {k:"usability", tag:"Usability", c:"var(--mint)", t:"Overall, how easy was SignSpeak to use?", s:["Very hard","Very easy"]},
    {k:"learnability", tag:"Learnability", c:"var(--sun)", t:"How quickly did you work out what to do, without any help?", s:["Very slowly","Instantly"]},
    {k:"affordance", tag:"Affordance", c:"var(--coral)", t:"Was it obvious what you could tap, type into or switch on?", s:["Not at all","Totally obvious"]},
    {k:"visibility", tag:"Visibility", c:"var(--sky)", t:"Could you easily see what the app was doing and where you were?", s:["Never","Always"]},
    {k:"feedback", tag:"Feedback", c:"var(--mint)", t:"Did the app tell you clearly when something worked, or went wrong?", s:["Never clear","Always clear"]},
    {k:"navigation", tag:"Navigation", c:"var(--sun)", t:"How easy was it to switch roles or go back?", s:["Very hard","Very easy"]},
    {k:"accessibility", tag:"Accessibility", c:"var(--coral)", t:"How comfortable were the text size, colours and buttons for you?", s:["Hard to read","Very comfortable"]},
    {k:"efficiency", tag:"Efficiency", c:"var(--sky)", t:"How quickly could you do what you wanted to do?", s:["Too slow","Fast"]},
    {k:"aesthetics", tag:"Look and feel", c:"var(--mint)", t:"How pleasant did the app look?", s:["Not at all","Love it"]},
    {k:"clarity", tag:"Understanding", c:"var(--sun)", t:"How clear was the text or sign the app showed?", s:["Confusing","Very clear"]},
    {k:"recommend", tag:"Overall", c:"var(--coral)", t:"How likely are you to recommend SignSpeak to a friend?", s:["Never","Definitely"]},
    {k:"improve", tag:"Your ideas", c:"var(--brand)", t:"What should we improve first?", multi:true, o:[
      "Clearer instructions","Bigger text and buttons","Better colours","More signs","Faster response","Easier navigation","Better voice input","More helpful messages","Camera setup","Nothing, I like it as it is"]}
  ];
  var FACES = [["😖","var(--coral)"],["🙁","#FF9F5A"],["😐","var(--sun)"],["🙂","#7BCF8E"],["🤩","var(--mint)"]];
  // var CHEERS = {3:"Great start! 🎈",6:"A third done. Nice! 🌟",9:"Over halfway there! 🚀",12:"Almost done, just a few more! 🔥",14:"Last one, we promise! 🎯"};
  var N = Q.length, i = 0, A = {}, sendTimer = null, t0 = Date.now(), back = false;
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage");
  var qs = new URLSearchParams(location.search);

  try { var saved = JSON.parse(sessionStorage.getItem("ss_sv_state") || "null");
    if (saved && saved.A){ A = saved.A; i = Math.min(saved.i || 0, N - 1); } } catch(e){}
  function persist(){ try { sessionStorage.setItem("ss_sv_state", JSON.stringify({A:A, i:i})); } catch(e){} }

  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    for (var k in (attrs||{})){ if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids||[]).forEach(function(c){ e.appendChild(c); });
    return e;
  }
  function progress(){
    var done = Math.min(i, N);
    $("fill").style.width = (done / N * 100) + "%";
    $("pb").setAttribute("aria-valuenow", done);
    $("count").textContent = Math.min(i + 1, N) + " / " + N;
    $("cheer").textContent = CHEERS[i] || "";
  }

  function render(){
    progress(); persist();
    var q = Q[i];
    var card = el("div", {"class":"card" + (back ? " back" : "")});
    card.style.setProperty("--acc", q.c);
    card.appendChild(el("span", {"class":"tag", text:q.tag}));
    var h = el("h1", {text:q.t, tabindex:"-1", id:"qh"}); card.appendChild(h);

    if (q.s){            // 1-5 face scale
      var g = el("div", {"class":"scale", role:"radiogroup", "aria-labelledby":"qh"});
      FACES.forEach(function(f, n){
        var b = el("button", {type:"button", "class":"face", role:"radio", "aria-checked": String(A[q.k] === n + 1),
          "aria-label": (n + 1) + " of 5. " + (n === 0 ? q.s[0] : n === 4 ? q.s[1] : "")}, [
          el("span", {"class":"e", text:f[0]}), el("span", {"class":"n", text:String(n + 1)})]);
        b.style.setProperty("--c", f[1]);
        b.addEventListener("click", function(){ choose(n + 1); });
        g.appendChild(b);
      });
      card.appendChild(g);
      card.appendChild(el("div", {"class":"ends"}, [el("span", {text:"1 · " + q.s[0]}), el("span", {text:"5 · " + q.s[1]})]));
    } else if (q.multi){ // last question: chips + optional comment
      var ch = el("div", {"class":"chips", role:"group", "aria-labelledby":"qh"});
      var cur = A[q.k] || [];
      q.o.forEach(function(name){
        var b = el("button", {type:"button", "class":"chip", "aria-pressed": String(cur.indexOf(name) >= 0), text:name});
        b.addEventListener("click", function(){
          var arr = A[q.k] || [], p = arr.indexOf(name);
          if (name.indexOf("Nothing") === 0) arr = p >= 0 ? [] : [name];
          else { arr = arr.filter(function(x){ return x.indexOf("Nothing") !== 0; }); if (p >= 0) arr = arr.filter(function(x){ return x !== name; }); else arr.push(name); }
          A[q.k] = arr; persist();
          Array.prototype.forEach.call(ch.children, function(c){ c.setAttribute("aria-pressed", String(arr.indexOf(c.textContent) >= 0)); });
        });
        ch.appendChild(b);
      });
      card.appendChild(ch);
      card.appendChild(el("p", {"class":"hint", text:"Tap as many as you think are needed."}));
      var more = el("div", {"class":"more"});
      more.appendChild(el("label", {"for":"comment", text:"Anything else you'd like to tell us? (optional)"}));
      // var ta = el("textarea", {id:"comment", maxlength:"600", placeholder:"Your idea, a problem you hit, or something you loved…"});
      ta.value = A.comment || "";
      ta.addEventListener("input", function(){ A.comment = ta.value; persist(); });
      more.appendChild(ta); card.appendChild(more);
    } else {             // single choice
      var og = el("div", {"class":"opts", role:"radiogroup", "aria-labelledby":"qh"});
      q.o.forEach(function(o, n){
        var b = el("button", {type:"button", "class":"opt", role:"radio", "aria-checked": String(A[q.k] === o[1])}, [
          el("span", {"class":"e", text:o[0]}), el("span", {text:o[1]}), el("span", {"class":"k", text:String(n + 1)})]);
        b.addEventListener("click", function(){ choose(o[1]); });
        og.appendChild(b);
      });
      card.appendChild(og);
    }

    var nav = el("div", {"class":"nav"});
    var bk = el("button", {type:"button", "class":"ghost", text:"← Back"});
    if (i === 0) bk.disabled = true;
    bk.addEventListener("click", function(){ go(i - 1); });
    nav.appendChild(bk);
    if (q.multi){
      var sb = el("button", {type:"button", "class":"go", id:"send", text:"Send my answers →"});
      sb.addEventListener("click", submit);
      nav.appendChild(sb);
    } else {
      nav.appendChild(el("span", {"class":"hint", text: A[q.k] != null ? "Tap again or press → to continue" : "Tap an answer to continue"}));
    }
    card.appendChild(nav);
    stage.replaceChildren(card);
    back = false;
    h.focus({preventScroll:true});
  }

  function choose(v){
    var q = Q[i]; A[q.k] = v; persist();
    clearTimeout(sendTimer);
    var group = stage.querySelector("[role=radiogroup]");
    Array.prototype.forEach.call(group.children, function(b, n){
      var on = q.s ? (n + 1 === v) : (q.o[n][1] === v);
      b.setAttribute("aria-checked", String(on));
    });
    sendTimer = setTimeout(function(){ go(i + 1); }, 420);
  }
  function go(n){
    clearTimeout(sendTimer);
    if (n < 0 || n >= N) return;
    back = n < i; i = n; render();
  }
  document.addEventListener("keydown", function(e){
    if (e.target && e.target.tagName === "TEXTAREA") return;
    var q = Q[i]; if (!q || document.getElementById("send") === null && i >= N) return;
    if (/^[1-9]$/.test(e.key)){
      var n = +e.key;
      if (q.s && n <= 5) choose(n); else if (q.o && !q.multi && n <= q.o.length) choose(q.o[n - 1][1]);
    } else if (e.key === "ArrowRight" && A[q.k] != null && !q.multi){ go(i + 1); }
    else if (e.key === "ArrowLeft"){ go(i - 1); }
  });

  // ------------------------------------------------------------ sending
  function payload(){
    var p = {id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2),
      submitted_at: new Date().toISOString(), src: qs.get("src") || "direct",
      seconds_in_app: qs.get("t") ? +qs.get("t") : "", roles_visited: qs.get("v") || "",
      survey_seconds: Math.round((Date.now() - t0) / 1000), screen: screen.width + "x" + screen.height};
    Q.forEach(function(q){ p[q.k] = q.multi ? (A[q.k] || []).join("; ") : (A[q.k] != null ? A[q.k] : ""); });
    p.comment = (A.comment || "").trim();
    return p;
  }
  function submit(){
    var btn = $("send"); if (btn){ btn.disabled = true; btn.textContent = "Sending…"; }
    var body = window.__pending || (window.__pending = payload());
    try { localStorage.setItem("ss_pending", JSON.stringify(body)); } catch(e){}
    window.__lastPayload = body;
    if (!CFG.SHEET_URL){ finish("demo"); return; }
    fetch(CFG.SHEET_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)})
      .then(function(){ try { localStorage.removeItem("ss_pending"); } catch(e){} finish("ok"); })
      .catch(function(){ finish("fail"); });
  }

  function finish(status){
    try { sessionStorage.removeItem("ss_sv_state"); } catch(e){}
    i = N; $("fill").style.width = "100%"; $("count").textContent = "Done 🎉"; $("cheer").textContent = "";
    var card = el("div", {"class":"card"}); card.style.setProperty("--acc", "var(--mint)");
    var box = el("div", {"class":"thanks"});
    if (status === "fail"){
      box.appendChild(el("div", {"class":"big", text:"📡"}));
      box.appendChild(el("h1", {text:"Oops, that didn't send"}));
      box.appendChild(el("p", {text:"Your answers are safe on this device. Check your internet connection and try again."}));
      var rb = el("button", {type:"button", "class":"go", text:"Try again"});
      rb.addEventListener("click", function(){ i = N - 1; render(); });
      box.appendChild(rb);
      card.appendChild(box); stage.replaceChildren(card); return;
    }
    box.appendChild(el("div", {"class":"big", text:"🎉"}));
    box.appendChild(el("h1", {text:"Thank you for testing SignSpeak for us."}));
    box.appendChild(el("p", {text:"You may close this tab and resume your own stuff now."}));
    if (status === "demo") box.appendChild(el("div", {"class":"demo", text:"Test mode: no Google Sheet is connected yet, so these answers were only kept in this browser. (Set SHEET_URL in docs/config.js.)"}));
    var a = el("a", {"class":"btn2", href: CFG.APP_URL || "#", text:"Back to SignSpeak"});
    box.appendChild(a);
    card.appendChild(box); stage.replaceChildren(card);
    window.__done = true; confetti(); h1focus();
  }
  function h1focus(){ var h = stage.querySelector("h1"); if (h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }

  function confetti(){
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = $("confetti"), x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
    var cols = ["#46B1E8","#35C590","#F5B800","#FF7A6B","#0B7F96"], P = [];
    for (var n = 0; n < 160; n++) P.push({x: W/2 + (Math.random()-.5)*200, y: H*0.35, vx:(Math.random()-.5)*16, vy:-Math.random()*15-4, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[n%5]});
    var f = 0;
    (function step(){
      x.clearRect(0,0,W,H);
      P.forEach(function(p){ p.vy += .42; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
        x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); });
      if (++f < 200) requestAnimationFrame(step); else x.clearRect(0,0,W,H);
    })();
  }

  render();
})();
</script>
</body>
</html>
